<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Great Festival Clicker Games</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app">
        <!-- Main Menu -->
        <section id="menu-screen" class="screen active">
            <h1 class="glow-title">Great Festival</h1>
            <p class="subtitle">Welcome to the Neon Arcade</p>
            <div class="menu-options">
                <div class="card card-red" onclick="app.selectGame(1)">
                    <h2>Game 1</h2>
                    <p>10 Second Challenge</p>
                    <div class="neon-line red"></div>
                </div>
                <div class="card card-fire" onclick="app.selectGame(2)">
                    <h2>Game 2</h2>
                    <p>Clicker 1-100</p>
                    <div class="neon-line fire"></div>
                </div>
            </div>
        </section>

        <!-- Player Name Screen -->
        <section id="name-screen" class="screen">
            <h2 id="name-game-title">Game Title</h2>
            <div class="input-group">
                <input type="text" id="player-name" placeholder="Enter Your Name" autocomplete="off" />
                <button class="btn btn-primary" onclick="app.startGame()">Start Game</button>
            </div>
            <button class="btn btn-secondary" onclick="app.showMenu()">Back to Menu</button>
        </section>

        <!-- Game 1 Screen (10 Second Challenge) -->
        <section id="game1-screen" class="screen game-screen theme-red">
            <div class="timer-display neon-red" id="game1-timer">10.000</div>
            <div class="score-display">Clicks: <span id="game1-score">0</span></div>
            <button class="btn btn-massive btn-red-glow" id="game1-btn" onclick="app.clickGame1()">CLICK!</button>
        </section>

        <!-- Game 2 Screen (Clicker 1-100) -->
        <section id="game2-screen" class="screen game-screen theme-fire">
            <div class="timer-display neon-fire" id="game2-timer">0.000</div>
            <div class="score-display">Progress: <span id="game2-score">0</span> / 100</div>
            <button class="btn btn-massive btn-fire-glow" id="game2-btn" onclick="app.clickGame2()">CLICK!</button>
        </section>

        <!-- Leaderboard Screen -->
        <section id="leaderboard-screen" class="screen">
            <h2 id="leaderboard-title">Leaderboard</h2>
            <div class="leaderboard-container">
                <p id="loading-leaderboard">Loading scores...</p>
                <ul id="leaderboard-list">
                    <!-- Scores will be injected here -->
                </ul>
            </div>
            <div class="actions">
                <button class="btn btn-primary" onclick="app.restartGame()">Play Again</button>
                <button class="btn btn-secondary" onclick="app.showMenu()">Main Menu</button>
            </div>
        </section>
    </div>

    <!-- Firebase module logic -->
    <script type="module" src="firebase.js"></script>
    <!-- App Game Logic -->
    <script src="app.js"></script>
</body>
</html>
